[project]
name = "solarView"
version = "1.0.0"
description = "Real-time SolarEdge inverter monitoring desktop app"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
solarview = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
